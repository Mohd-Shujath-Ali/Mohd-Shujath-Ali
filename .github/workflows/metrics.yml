
name: GitHub Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest

        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mohd-Shujath-Ali
          filename: metrics.svg
          template: classic

          # Main profile information
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_order: base.header, base.activity, base.community, base.repositories, isocalendar, languages, habits, achievements, base.metadata

          # Isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most-used programming languages
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_categories: programming, data
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage

          # Match your Git commit authorship
          commits_authoring: Mohammed Shujath Ali, Mohd-Shujath-Ali

          # Coding activity and habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # GitHub achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 8

          # Save generated SVG to the repository
          output_action: commit
